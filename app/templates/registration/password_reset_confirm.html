{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        {% if validlink %}
            <h4 class="fw-bold mb-3">Nueva contraseña</h4>
            <form method="post">{% csrf_token %}{{ form|crispy }}
                <button class="btn btn-brand w-100 mt-2">Guardar</button>
            </form>
        {% else %}
            <div class="alert alert-danger mb-0">El enlace no es válido o ya fue usado.</div>
        {% endif %}
    </div></div>
</div></div>
{% endblock %}
