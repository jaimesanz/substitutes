# Production compose for a single EC2 host.
#
# Pulls the pre-built image from GHCR (published by CI) instead of building.
# Watchtower watches the `web` container and, when a new `:latest` image is
# pushed to GHCR, pulls it and recreates the container. On every (re)start the
# image entrypoint runs migrations + collectstatic + seed before Gunicorn, so
# updates apply the DB schema automatically.
#
# Data that must survive restarts/updates lives in named volumes:
#   - postgres_data : the database
#   - static_volume : collected static files (served by nginx)
#   - media_volume  : uploaded certificates/documents (served by nginx)
#
# Usage on EC2:
#   cp .env.example .env   # set DEBUG=0, ALLOWED_HOSTS, strong passwords, etc.
#   docker compose -f docker-compose.prod.yml up -d
#
# If the GHCR package is PRIVATE, first authenticate so both the initial pull
# and Watchtower can read it:
#   echo <GHCR_PAT> | docker login ghcr.io -u <github-user> --password-stdin
# (Watchtower reuses /root/.docker/config.json, mounted below.)

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/jaimesanz/substitutes:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    labels:
      # Only containers with this label are auto-updated by Watchtower.
      com.centurylinklabs.watchtower.enable: "true"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # If the GHCR image is PRIVATE, `docker login ghcr.io` on the host first,
      # then uncomment the next line so Watchtower can authenticate pulls.
      # (Leave it commented for a public image — binding a missing file breaks startup.)
      # - /root/.docker/config.json:/config.json:ro
    environment:
      # Watch only containers explicitly labeled above (db/nginx stay pinned).
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove old images after updating.
      WATCHTOWER_CLEANUP: "true"
      # Check GHCR every 60s. Raise (e.g. 300) to poll less often.
      WATCHTOWER_POLL_INTERVAL: "60"
      # Recreate dependent containers cleanly on update.
      WATCHTOWER_ROLLING_RESTART: "true"

volumes:
  postgres_data:
  static_volume:
  media_volume:
