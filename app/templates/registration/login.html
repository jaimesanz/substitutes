{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Ingresar · Reemplazos{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3">Ingresar</h3>
                {% if form.non_field_errors %}
                    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-brand w-100 mt-2">Entrar</button>
                </form>
                <div class="d-flex justify-content-between mt-3 small">
                    <a href="{% url 'password_reset' %}">Olvidé mi contraseña</a>
                    <a href="{% url 'register_choice' %}">Crear cuenta</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
