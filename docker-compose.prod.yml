# Production compose for the Raspberry Pi (arm64). Served at https://substitutes.jaimesa.nz/.
#
#   cp .env.production.example .env      # fill in every value (never commit it)
#   docker compose -f docker-compose.prod.yml up -d
#
# - Holds only the app's own containers. Postgres, backups, the Cloudflare Tunnel and Watchtower come
#   from the host's shared stack (services/shared in the self_hosted repo), which must be running.
#   Create the database and login there first, as that stack's compose file describes.
# - The tunnel terminates TLS and forwards by path: /media/* to substitutes-media:8080, everything
#   else to substitutes-web:8000, both on the external `substitutes-tunnel` network. Nothing publishes ports.
# - `media` serves uploads read-only, because Django doesn't serve them in production. Its
#   Caddyfile marks them uncacheable, so Cloudflare doesn't keep copies of teachers' certificates.
# - SECURE_COOKIES=1 because the tunnel serves HTTPS only.
# - Secrets have no defaults: compose refuses to start until .env sets them.
# - `web` image comes from GHCR (published by CI for amd64 and arm64 on every push to main). Its
#   entrypoint waits for Postgres, then runs migrate + collectstatic + seed before Gunicorn, so
#   updates self-migrate. The shared Watchtower pulls new images for containers labelled below.
# - Persistent named volume: media_volume (uploads), named substitutes_media_volume on the host.

name: substitutes

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  pids_limit: 256

x-web-env: &web-env
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  DEBUG: "0"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in .env}
  DJANGO_SCRIPT_NAME: ${DJANGO_SCRIPT_NAME:-}
  SECURE_COOKIES: ${SECURE_COOKIES:-0}
  POSTGRES_DB: ${POSTGRES_DB:-reemplazos}
  POSTGRES_USER: ${POSTGRES_USER:-reemplazos}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: shared-postgres
  POSTGRES_PORT: "5432"
  # Creates this superuser on first start only if both are set; never changes an existing one.
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  HOME: /tmp

x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  web:
    <<: *hardening
    image: ghcr.io/jaimesanz/substitutes:${IMAGE_TAG:-latest}
    # The image has no user of its own. Its entrypoint collects static files at start.
    user: "1000:1000"
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
      - /app/staticfiles:size=64m,uid=1000,gid=1000
    restart: unless-stopped
    environment: *web-env
    expose:
      - "8000"
    volumes:
      - media_volume:/app/media
    # No internet access: it only needs Postgres and the tunnel.
    networks:
      substitutes-data: {}
      substitutes-tunnel:
        aliases: [substitutes-web]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/', headers={'Host': 'localhost'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 384m
    logging: *logging

  media:
    <<: *hardening
    image: caddy:2-alpine
    user: "1000:1000"
    # The image's binary carries this file capability, and won't start without it. Nothing binds a
    # low port.
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /config:size=8m,uid=1000,gid=1000
      - /data:size=8m,uid=1000,gid=1000
    restart: unless-stopped
    volumes:
      - ./media.Caddyfile:/etc/caddy/Caddyfile:ro
      - media_volume:/srv/media:ro
    networks:
      substitutes-tunnel:
        aliases: [substitutes-media]
    mem_limit: 64m
    logging: *logging

volumes:
  media_volume:

networks:
  substitutes-data:
    external: true
  substitutes-tunnel:
    external: true
