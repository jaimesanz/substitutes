# Production compose for the shared EC2 host. Served at https://jaimesa.nz/substitutes/.
#
#   cp .env.production.example .env      # fill in every value (never commit it)
#   docker compose -f docker-compose.prod.yml up -d
#
# - No proxy here: the host's shared Caddy (the load-balancer repo) owns 80/443, terminates TLS,
#   strips /substitutes and forwards to `web`, which it reaches as substitutes-web on the external
#   `edge` network (`docker network create edge`, once per host). It also serves uploaded media
#   straight from the media_volume volume, mounted read-only into it.
# - DJANGO_SCRIPT_NAME=/substitutes makes Django add the path back to every URL it builds and
#   scopes cookies to it; SECURE_COOKIES=1 because the proxy serves HTTPS only.
# - Secrets have no defaults: compose refuses to start until .env sets them.
# - `web` image comes from GHCR (published by CI on every push to main). Its entrypoint runs
#   migrate + collectstatic + seed before Gunicorn, so updates self-migrate. The host's Watchtower
#   (in the load-balancer stack) pulls new images for containers labelled below.
# - Persistent named volumes: pgdata (db) and media_volume (uploads). With the project name
#   `substitutes` they are substitutes_pgdata and substitutes_media_volume; the shared proxy mounts
#   the latter by that name.
# - db uses postgres:16-alpine, the same image as the host's other stacks, so the server keeps one
#   copy. It replaced postgres:16 (Debian) by dump and restore into pgdata: the two images sort
#   text differently, so the old data directory (postgres_data) can't be reused as is.

x-web-env: &web-env
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  DEBUG: "0"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in .env}
  DJANGO_SCRIPT_NAME: ${DJANGO_SCRIPT_NAME:-}
  SECURE_COOKIES: ${SECURE_COOKIES:-0}
  POSTGRES_DB: ${POSTGRES_DB:-reemplazos}
  POSTGRES_USER: ${POSTGRES_USER:-reemplazos}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  # Creates this superuser on first start only if both are set; never changes an existing one.
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reemplazos}
      POSTGRES_USER: ${POSTGRES_USER:-reemplazos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reemplazos} -d ${POSTGRES_DB:-reemplazos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/jaimesanz/substitutes:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *web-env
    expose:
      - "8000"
    volumes:
      - media_volume:/app/media
    networks:
      default: {}
      edge:
        aliases: [substitutes-web]
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  pgdata:
  media_volume:

networks:
  edge:
    external: true
