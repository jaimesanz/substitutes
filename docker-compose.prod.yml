# Production compose for a single EC2 host — "just works", no host files needed.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# - No host bind-mounts: the Caddy reverse-proxy config is inlined via the
#   compose `configs:` block below, so there's nothing to copy onto the host.
# - No required .env: every setting has an inline default (override via env or a
#   .env if you want). For a real deployment, override at least SECRET_KEY,
#   POSTGRES_PASSWORD and DJANGO_SUPERUSER_PASSWORD.
# - `web` image comes from GHCR (published by CI). Its entrypoint runs
#   migrate + collectstatic + seed before Gunicorn, so updates self-migrate.
#   Static files are served by WhiteNoise from inside the app; Caddy serves
#   uploaded media from a shared volume and reverse-proxies everything else.
# - Watchtower auto-pulls a new `web` image pushed to GHCR and recreates it.
# - Persistent named volumes: postgres_data (db) and media_volume (uploads).
#
# PORT: defaults to 80 (HTTP) and 443 (HTTPS). To use a non-standard HTTP port,
# set HTTP_PORT, e.g.  HTTP_PORT=8080 docker compose -f docker-compose.prod.yml up -d
# then browse http://<ec2-ip>:8080  (open that port in the security group).
#
# HTTPS: leave CADDY_SITE_ADDRESS at the default ":80" for plain HTTP on the EC2
# public IP. Point a domain at the host and set CADDY_SITE_ADDRESS=tu-dominio.cl
# (plus CSRF_TRUSTED_ORIGINS=https://tu-dominio.cl) and Caddy obtains a Let's
# Encrypt certificate automatically. (Automatic HTTPS needs the standard ports
# 80/443; on a custom HTTP-only port, use plain http.)
#
# GHCR package must be PUBLIC to pull with no host login (GitHub → repo →
# Packages → make public). To keep it private, `docker login ghcr.io` on the
# host once and uncomment the docker-config mount in the watchtower service.

x-web-env: &web-env
  SECRET_KEY: ${SECRET_KEY:-change-me-insecure-default-key}
  DEBUG: ${DEBUG:-0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  POSTGRES_DB: ${POSTGRES_DB:-reemplazos}
  POSTGRES_USER: ${POSTGRES_USER:-reemplazos}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reemplazos-prod-pass}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@substitutes.local}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin12345}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reemplazos}
      POSTGRES_USER: ${POSTGRES_USER:-reemplazos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reemplazos-prod-pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reemplazos} -d ${POSTGRES_DB:-reemplazos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/jaimesanz/substitutes:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *web-env
    expose:
      - "8000"
    volumes:
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Host port is configurable. Default: HTTP on 80 + HTTPS on 443.
      # For a non-standard HTTP port, set HTTP_PORT (e.g. HTTP_PORT=8080) and
      # reach the app at http://<ec2-ip>:8080 — remember to open that port in
      # the EC2 security group. Caddy still listens on :80 inside the container.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - media_volume:/srv/media:ro
    depends_on:
      - web

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # For a PRIVATE GHCR image: `docker login ghcr.io` on the host, then
      # uncomment the next line so Watchtower can authenticate pulls.
      # - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"

configs:
  caddyfile:
    content: |
      {$$CADDY_SITE_ADDRESS} {
          encode zstd gzip
          handle_path /media/* {
              root * /srv/media
              file_server
          }
          handle {
              reverse_proxy web:8000
          }
      }

volumes:
  postgres_data:
  media_volume:
  caddy_data:
  caddy_config:
