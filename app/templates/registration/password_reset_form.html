{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <h4 class="fw-bold mb-3">Recuperar contraseña</h4>
        <p class="text-muted">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
        <form method="post">{% csrf_token %}{{ form|crispy }}
            <button class="btn btn-brand w-100 mt-2">Enviar enlace</button>
        </form>
    </div></div>
</div></div>
{% endblock %}
